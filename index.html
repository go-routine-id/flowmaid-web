<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowmaid playground</title>
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  })();
  function toggleTheme() {
    var cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  }
</script>
<style>
  :root {
    --ink: #232840; --ink-strong: #14172a; --line: #dde2f3; --accent: #5468c7;
    --accent-2: #199a8e; --accent-glow: rgba(84,104,199,.28);
    --bg: #eef1fb; --card: #ffffff; --panel: #fbfcff;
    --muted: #697089;
    --err: #d13438; --err-bg: #fff2f2; --err-line: #ffdbdb;
    --shadow-sm: 0 1px 2px rgba(20,23,42,.06), 0 2px 10px rgba(20,23,42,.06);
    --shadow-md: 0 2px 6px rgba(20,23,42,.07), 0 14px 34px rgba(20,23,42,.10);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ink: #dee3f4; --ink-strong: #ffffff; --line: #2c3350; --accent: #93a2ef;
    --accent-2: #34c8ba; --accent-glow: rgba(147,162,239,.22);
    --bg: #12141d; --card: #191d2b; --panel: #151927;
    --muted: #9098b4;
    --err: #ff8787; --err-bg: #2b1a20; --err-line: #573240;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.30);
    --shadow-md: 0 2px 6px rgba(0,0,0,.40), 0 18px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #dee3f4; --ink-strong: #ffffff; --line: #2c3350; --accent: #93a2ef;
      --accent-2: #34c8ba; --accent-glow: rgba(147,162,239,.22);
      --bg: #12141d; --card: #191d2b; --panel: #151927;
      --muted: #9098b4;
      --err: #ff8787; --err-bg: #2b1a20; --err-line: #573240;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.30);
      --shadow-md: 0 2px 6px rgba(0,0,0,.40), 0 18px 40px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; color: var(--ink);
    display: flex; flex-direction: column; height: 100vh;
    background:
      radial-gradient(900px 480px at 88% -12%, var(--accent-glow), transparent 62%),
      radial-gradient(720px 420px at -8% 112%, rgba(31,166,153,.14), transparent 58%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--line) 80%, var(--muted));
    border-radius: 999px; border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-track { background: transparent; }

  header, footer {
    background: color-mix(in srgb, var(--card) 82%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    z-index: 1;
  }
  header h1 {
    font-size: 19px; margin: 0; letter-spacing: -.02em; font-weight: 800;
    background: linear-gradient(96deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header h1::after {
    content: ""; display: inline-block; width: 7px; height: 7px;
    margin-left: 7px; border-radius: 50%;
    background: radial-gradient(circle at 32% 32%, var(--accent-2), var(--accent));
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  header .sub { font-size: 12.5px; color: var(--muted); letter-spacing: -.005em; }
  header .spacer { flex: 1; }
  header > a {
    font-size: 13px; font-weight: 600; color: var(--accent);
    text-decoration: none; padding: 6px 10px; border-radius: 8px;
    transition: background-color .15s ease;
  }
  header > a:hover { background: var(--accent-glow); }

  button, select {
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 13px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, box-shadow .15s ease,
                transform .12s ease, background-color .15s ease, color .15s ease;
  }
  button:hover, select:hover {
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  button:active, select:active { transform: scale(.97); }
  button:focus-visible, select:focus-visible, header > a:focus-visible,
  #editor:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #download {
    background: linear-gradient(96deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
  }
  #download:hover { color: #fff; filter: brightness(1.06); }

  main { display: flex; flex: 1; min-height: 0; }
  #editor {
    width: 38%; min-width: 280px; border: 0; border-right: 1px solid var(--line);
    padding: 16px 18px; font: 500 13px/1.65 ui-monospace, Menlo, monospace;
    resize: none; outline: none; color: var(--ink);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    caret-color: var(--accent);
  }
  #view {
    flex: 1; overflow: auto; display: grid; place-items: center; padding: 26px;
    touch-action: none; /* pointer-drag nodes on touch screens too */
    background-image: radial-gradient(
      color-mix(in srgb, var(--line) 66%, transparent) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #view svg {
    max-width: 100%; height: auto;
    filter: drop-shadow(0 10px 28px rgba(20,23,42,.14));
    border-radius: 12px;
  }
  :root[data-theme="dark"] #view svg { filter: drop-shadow(0 12px 30px rgba(0,0,0,.55)); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #view svg {
      filter: drop-shadow(0 12px 30px rgba(0,0,0,.55));
    }
  }

  #error {
    display: none; margin: 0 18px 12px; padding: 11px 18px;
    font-size: 13px; font-weight: 500; color: var(--err);
    background: var(--err-bg); border: 1px solid var(--err-line);
    border-radius: 12px; box-shadow: var(--shadow-md);
  }
  footer {
    padding: 7px 18px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  footer #version {
    padding: 2px 10px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line); color: var(--accent);
  }
  footer a {
    color: var(--muted); text-decoration: none; padding: 3px 8px;
    border-radius: 8px; transition: color .15s ease, background-color .15s ease;
  }
  footer a:hover { color: var(--accent); background: var(--accent-glow); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>flowmaid</h1>
  <span class="sub">Mermaid-like diagrams, rendered by pure Rust in your browser — drag the nodes!</span>
  <span class="spacer"></span>
  <a href="/flowmaid/docs/">Docs</a>
  <button id="theme" title="Toggle dark mode" onclick="toggleTheme()">🌓</button>
  <select id="examples">
    <option value="flow">Example: Flowchart</option>
    <option value="styled">Example: Styled flowchart</option>
    <option value="er">Example: ER diagram</option>
    <option value="class">Example: Class diagram</option>
    <option value="seq">Example: Sequence diagram</option>
    <option value="pie">Example: Pie chart</option>
    <option value="statechart">Example: State diagram</option>
    <option value="advance">Example: Swimlane (advance)</option>
  </select>
  <button id="relayout">Auto layout</button>
  <button id="download">Download SVG</button>
</header>
<main>
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="view"></div>
</main>
<div id="error"></div>
<footer>
  <span id="version">loading engine…</span>
  <a href="/flowmaid/docs/">documentation</a>
  <a href="https://crates.io/crates/flowmaid" target="_blank">crates.io</a>
  <a href="https://github.com/go-routine-id/flowmaid" target="_blank">engine source</a>
  <a href="https://github.com/go-routine-id/flowmaid-web" target="_blank">playground source</a>
  <a href="https://github.com/go-routine-id/flowmaid/issues/10" target="_blank">roadmap</a>
</footer>

<script type="module">
import init, {
  render_routed, node_keys, auto_positions, node_sizes, engine_version,
  render_advance_svg, layout_advance_json, render_advance_routed_with_lanes,
} from "./pkg/flowmaid_web.js";

const EXAMPLES = {
  flow: `flowchart TD
    A([Start]) --> B[Read input]
    B --> C{Valid?}
    C -->|yes| D[Process data]
    C -->|no| E[Show error]
    E --> B
    D ==> F((Done))`,
  styled: `flowchart LR
    U[User] --> FE(Frontend) --> API{Auth?}
    API -->|ok| SVC[Service]
    API -.->|denied| ERR[401]
    SVC ==> DB[Database]:::store
    classDef store fill:#e4f5f4,stroke:#199a8e,color:#0b6e66
    style ERR fill:#ffe3e3,stroke:#e03131,color:#c92a2a
    style U fill:#fff3bf,stroke:#f08c00,stroke-width:3px`,
  er: `erDiagram
    users ||--o{ posts : "writes"
    posts }o--|| categories : "in"
    users {
        uuid id PK "default gen_random_uuid()"
        varchar(255) email UK "not null"
        timestamp created_at
    }
    posts {
        uuid id PK
        uuid author_id FK "not null, index"
        text body
    }`,
  class: `classDiagram
    class Animal {
        +String name
        -int age
        +move() void
    }
    class Dog {
        +bark() void
    }
    Animal <|-- Dog
    Animal <|-- Cat
    Animal "1" o-- "*" Toy : owns
    Dog "1" --> "*" Toy : plays with
    Cat ..> Toy : ignores`,
  seq: `sequenceDiagram
    autonumber
    actor U as User
    participant API
    participant DB
    U->>+API: GET /profile
    API->>DB: SELECT user
    DB-->>API: row
    API-->>-U: 200 OK
    Note over U,API: cached for 60s
    loop every minute
        API->>API: refresh token
    end`,
  pie: `pie showData
    title Key elements in Product X
    "Calcium" : 42.96
    "Potassium" : 50.05
    "Magnesium" : 10.01
    "Iron" : 6`,
  statechart: `stateDiagram-v2
    [*] --> Idle
    Idle : waiting for input
    Idle --> Validating : submit
    state Validating {
        direction LR
        [*] --> Syntax
        Syntax --> Semantics : ok
        Semantics --> [*]
    }
    state decide <<choice>>
    Validating --> decide
    decide --> Rejected : invalid
    decide --> Done : valid
    Rejected --> Idle : retry
    Done --> [*]`,
  advance: `{
  "lanes": [
    {"id": "dev", "title": "Development"},
    {"id": "qa", "title": "QA"}
  ],
  "nodes": [
    {"id": "design", "label": "Design", "lane": "dev", "shape": "rect"},
    {"id": "code", "label": "Code", "lane": "dev", "shape": "rounded"},
    {"id": "test", "label": "Test", "lane": "qa", "shape": "diamond"},
    {"id": "sign", "label": "Sign off", "lane": "qa", "shape": "stadium"}
  ],
  "edges": [
    {"from": "design", "to": "code", "label": "implements"},
    {"from": "code", "to": "test", "label": "hand over"},
    {"from": "test", "to": "sign", "label": "approve"}
  ]
}`,
};

const editor = document.getElementById("editor");
const view = document.getElementById("view");
const errBox = document.getElementById("error");

// Last good document — the drag/render state. Mirrors the desktop
// app: half-typed text keeps the previous diagram interactive, and
// dragged positions survive edits via their node keys.
let good = null; // { src, keys: string[], pos: number[], sizes: number[] }
// Dragged positions by node key — outlives `good`, so drags survive
// even when the text passes through a static diagram (pie/sequence,
// which contribute no keys) and back. Found by a bug hunt.
const savedPos = new Map();

// Advance / swimlane diagrams use JSON input instead of Mermaid syntax.
function isAdvance(src) {
  return src.trim().startsWith("{");
}

function rebuild(src) {
  try {
    // Positions semantics differ between advance (offset-x + y) and
    // other diagrams (absolute centres), so drop remembered drags when
    // switching diagram types.
    if (good && isAdvance(src) !== isAdvance(good.src)) {
      savedPos.clear();
    }
    // Advance diagrams are self-contained JSON: seed drag state from
    // layout_advance_json, then render via the routed renderer so nodes
    // can be dragged just like flowcharts.
    if (isAdvance(src)) {
      const layout = JSON.parse(layout_advance_json(src));
      const nodes = layout.nodes;
      const keys = nodes.map((n) => n.id);
      const sizes = nodes.flatMap((n) => [n.w, n.h]);
      const laneIndex = Object.fromEntries(layout.lanes.map((l, i) => [l.id, i]));
      const nodeLanes = nodes.map((n) => laneIndex[n.lane]);
      const margin = layout.lanes[0]?.x ?? 24;
      const gap = layout.lanes.length > 1
        ? layout.lanes[1].x - (layout.lanes[0].x + layout.lanes[0].w)
        : 40;
      const lanes = layout.lanes.map((l) => ({ id: l.id, w: l.w }));
      if (good) {
        good.keys.forEach((k, i) =>
          savedPos.set(k, [good.pos[i * 2], good.pos[i * 2 + 1]])
        );
      }
      const pos = nodes.flatMap((n, i) => savedPos.get(keys[i]) ?? [0, n.y]);
      good = { src, keys, pos, sizes, advance: { lanes, margin, gap, nodeLanes } };
      errBox.style.display = "none";
      render();
      return;
    }
    const keys = node_keys(src).split("\n").filter(Boolean);
    const auto = Array.from(auto_positions(src));
    const sizes = Array.from(node_sizes(src));
    if (good) {
      good.keys.forEach((k, i) =>
        savedPos.set(k, [good.pos[i * 2], good.pos[i * 2 + 1]])
      );
    }
    const pos = keys.flatMap((k, i) => savedPos.get(k) ?? [auto[i * 2], auto[i * 2 + 1]]);
    good = { src, keys, pos, sizes };
    errBox.style.display = "none";
    render();
  } catch (e) {
    errBox.textContent = String(e.message ?? e);
    errBox.style.display = "block";
  }
}

function advanceAbsPos() {
  if (!good?.advance) return [];
  const { lanes, margin, gap, nodeLanes } = good.advance;
  const abs = new Float64Array(good.pos.length);
  for (let i = 0; i < good.keys.length; i++) {
    let lx = margin;
    const li = nodeLanes[i];
    for (let j = 0; j < li; j++) lx += lanes[j].w + gap;
    abs[i * 2] = lx + lanes[li].w / 2 + good.pos[i * 2];
    abs[i * 2 + 1] = good.pos[i * 2 + 1];
  }
  return abs;
}

function addLaneSeparators(svg) {
  if (!good?.advance || !svg) return;
  const ns = "http://www.w3.org/2000/svg";
  const { lanes, margin } = good.advance;
  const vb = svg.viewBox.baseVal;
  let lx = margin;
  for (let i = 0; i < lanes.length; i++) {
    lx += lanes[i].w;
    const x = lx;
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", x);
    line.setAttribute("y1", margin);
    line.setAttribute("x2", x);
    line.setAttribute("y2", vb.height - margin);
    line.setAttribute("stroke-width", "2");
    line.setAttribute("stroke-dasharray", "4 3");
    line.setAttribute("opacity", "0.55");
    line.style.stroke = "var(--line)";
    line.style.pointerEvents = "none";
    svg.appendChild(line);
  }
}

function render() {
  if (!good) return;
  if (isAdvance(good.src)) {
    const { lanes, margin, gap } = good.advance;
    view.innerHTML = render_advance_routed_with_lanes(
      good.src,
      advanceAbsPos(),
      new Float64Array(lanes.map((l) => l.w)),
      margin,
      gap
    );
    addLaneSeparators(view.querySelector("svg"));
  } else {
    view.innerHTML = render_routed(good.src, new Float64Array(good.pos));
  }
}

let raf = 0;
function scheduleRender() {
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
}

// ── Drag & drop, desktop-style: hit-test on node boxes and lane
//    borders, apply pointer deltas in world units, let the engine
//    re-route. ──
let drag = null; // { i, cx, cy }
let laneDrag = null; // { i, cx }

function svgScale() {
  const svg = view.querySelector("svg");
  if (!svg) return null;
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return { svg, r, sx: vb.width / r.width, sy: vb.height / r.height };
}

function hitNode(ev) {
  const s = svgScale();
  if (!s || !good) return -1;
  const x = (ev.clientX - s.r.left) * s.sx;
  const y = (ev.clientY - s.r.top) * s.sy;
  const abs = isAdvance(good.src) ? advanceAbsPos() : good.pos;
  for (let i = good.keys.length - 1; i >= 0; i--) {
    const cx = abs[i * 2], cy = abs[i * 2 + 1];
    const w = good.sizes[i * 2], h = good.sizes[i * 2 + 1];
    if (Math.abs(x - cx) <= w / 2 && Math.abs(y - cy) <= h / 2) return i;
  }
  return -1;
}

function hitLaneBorder(ev) {
  const s = svgScale();
  if (!s || !good?.advance) return -1;
  const x = (ev.clientX - s.r.left) * s.sx;
  const { lanes, margin, gap } = good.advance;
  let lx = margin;
  for (let i = 0; i < lanes.length; i++) {
    const borderX = lx + lanes[i].w;
    if (Math.abs(x - borderX) <= 12) return i;
    lx += lanes[i].w + (i < lanes.length - 1 ? gap : 0);
  }
  return -1;
}

view.addEventListener("pointerdown", (ev) => {
  const li = hitLaneBorder(ev);
  if (li >= 0) {
    laneDrag = { i: li, cx: ev.clientX };
    view.setPointerCapture(ev.pointerId);
    view.style.cursor = "col-resize";
    ev.preventDefault();
    return;
  }
  const i = hitNode(ev);
  if (i < 0) return;
  drag = { i, cx: ev.clientX, cy: ev.clientY };
  view.setPointerCapture(ev.pointerId);
  view.style.cursor = "grabbing";
  ev.preventDefault();
});

view.addEventListener("pointermove", (ev) => {
  if (laneDrag) {
    const s = svgScale();
    if (!s) return;
    const dx = (ev.clientX - laneDrag.cx) * s.sx;
    good.advance.lanes[laneDrag.i].w = Math.max(80, good.advance.lanes[laneDrag.i].w + dx);
    laneDrag.cx = ev.clientX;
    scheduleRender();
    return;
  }
  if (!drag) {
    const border = hitLaneBorder(ev);
    view.style.cursor = border >= 0 ? "col-resize" : (hitNode(ev) >= 0 ? "grab" : "default");
    return;
  }
  const s = svgScale();
  if (!s) return;
  good.pos[drag.i * 2] += (ev.clientX - drag.cx) * s.sx;
  good.pos[drag.i * 2 + 1] += (ev.clientY - drag.cy) * s.sy;
  drag.cx = ev.clientX;
  drag.cy = ev.clientY;
  scheduleRender();
});

for (const t of ["pointerup", "pointercancel"]) {
  view.addEventListener(t, () => {
    drag = null;
    laneDrag = null;
    view.style.cursor = "default";
  });
}

// ── Wiring ──
let deb;
editor.addEventListener("input", () => {
  clearTimeout(deb);
  deb = setTimeout(() => rebuild(editor.value), 120);
});

document.getElementById("examples").addEventListener("change", (e) => {
  editor.value = EXAMPLES[e.target.value];
  good = null; // fresh example, fresh layout
  rebuild(editor.value);
});

document.getElementById("relayout").addEventListener("click", () => {
  if (!good) return;
  if (isAdvance(good.src)) {
    const layout = JSON.parse(layout_advance_json(good.src));
    good.advance.lanes = layout.lanes.map((l) => ({ id: l.id, w: l.w }));
    good.pos = layout.nodes.flatMap((n) => [0, n.y]);
    good.sizes = layout.nodes.flatMap((n) => [n.w, n.h]);
  } else {
    good.pos = Array.from(auto_positions(good.src));
  }
  // Auto layout is an explicit reset — drop the remembered drags so
  // they don't resurrect on the next edit.
  good.keys.forEach((k) => savedPos.delete(k));
  render();
});

document.getElementById("download").addEventListener("click", () => {
  const svg = view.querySelector("svg");
  if (!svg) return;
  const blob = new Blob([svg.outerHTML], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "diagram.svg";
  a.click();
  URL.revokeObjectURL(a.href);
});

await init();
document.getElementById("version").textContent =
  `engine v${engine_version()} · wasm`;
editor.value = EXAMPLES.flow;
rebuild(editor.value);
</script>
</body>
</html>
