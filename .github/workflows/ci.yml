name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --lib --target wasm32-unknown-unknown

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy -p flowmaid-mcp --all-targets -- -D warnings
      - run: cargo build -p flowmaid-mcp
      # The playground's edit logic (wasm build of src/edit.rs) against its JS tests.
      - run: node tests/flowedit.test.mjs
      - run: npm ci
        working-directory: mcp/test
      - run: npm test
        working-directory: mcp/test
