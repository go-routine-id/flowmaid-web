[package]
name = "flowmaid-mcp"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/flowmaid-web"
description = "MCP server for flowmaid: an AI agent builds and edits Mermaid-style diagrams, with a live playground synced both ways"
publish = false

[[bin]]
name = "flowmaid-mcp"
path = "src/main.rs"

[dependencies]
flowmaid-web = { path = ".." }
flowmaid = { git = "https://github.com/go-routine-id/flowmaid", tag = "v0.40.2" }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time", "net"] }
serde_json = "1.0.154"
axum = "0.8.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
base64 = "0.23.1"
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
