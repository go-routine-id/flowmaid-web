[package]
name = "flowmaid-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/flowmaid-web"
description = "WASM bindings + web playground for the flowmaid diagram engine"
publish = false # ships as a wasm bundle, not a crates.io library

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flowmaid = { path = "../flowmaid" }
wasm-bindgen = "0.2"

[profile.release]
# Small wasm beats fast wasm here — renders are sub-millisecond anyway.
opt-level = "s"
lto = true
